<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Official Jersey — Image Gallery</title>
  <style>
    :root{
      --ink:#111;
      --muted:#8b8b8b;
      --card:#fff;
      --bg:#f6f7f9;
      --shadow:0 10px 24px rgba(0,0,0,.06);
      --radius:14px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;
      color:var(--ink);
      background:linear-gradient(#fafbfc,#f4f6f8);
    }
    .wrap{
      max-width:1200px;
      margin:40px auto;
      padding:0 20px;
    }
    header{
      display:flex; gap:16px; align-items:end; flex-wrap:wrap;
      margin-bottom:18px;
    }
    h1{font-size:22px; margin:0}
    .hint{color:var(--muted); font-size:13px}
    .controls{margin-left:auto; display:flex; gap:10px; align-items:center}
    .search{
      min-width:220px; padding:10px 12px; border:1px solid #ddd; border-radius:10px; background:#fff;
      font-size:14px; outline:none;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:22px;
    }
    @media (max-width:1024px){ .grid{ grid-template-columns:repeat(3,1fr); } }
    @media (max-width:820px){  .grid{ grid-template-columns:repeat(2,1fr); } }
    @media (max-width:520px){  .grid{ grid-template-columns:1fr; } }

    .card{
      background:var(--card); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);
      display:flex; flex-direction:column;
    }
    .thumb{
      position:relative; height:280px; background:#f7f7f7; overflow:hidden; display:grid; place-items:center;
    }
    .thumb img{
      width:100%; height:100%; object-fit:contain; display:block;
      transition:transform .45s ease;
    }
    .card:hover .thumb img{ transform:scale(1.06); }

    .meta{ padding:14px 14px 16px; display:flex; flex-direction:column; gap:10px; }
    .title{ font-weight:700; line-height:1.3; word-break:break-word; }
    .actions{ display:flex; gap:8px; margin-top:auto; }
    .btn{
      appearance:none; border:1px solid #222; background:#fff; color:#111; font-weight:600;
      padding:8px 10px; border-radius:10px; cursor:pointer; font-size:13px;
    }
    .btn.secondary{ border-color:#bbb; color:#444 }
    .empty{ color:var(--muted); padding:30px 0 }
    .footer-note{ margin-top:16px; color:var(--muted); font-size:12px }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Official Jersey — Gallery</h1>
        <div class="hint">Автоподхват PNG из репозитория через GitHub API. Клик по превью — открыть в новой вкладке.</div>
      </div>
      <div class="controls">
        <input id="q" class="search" type="search" placeholder="Поиск по имени…" />
      </div>
    </header>

    <div id="grid" class="grid" aria-live="polite"></div>
    <div id="empty" class="empty" hidden>Ничего не найдено.</div>

    <div class="footer-note">
      Скопировать ссылку можно в виде CDN (<code>jsDelivr</code>) или прямой (<code>raw.githubusercontent.com</code>).
    </div>
  </div>

  <script>
    // === Настройки под твой репозиторий ===
    const USER   = 'Skif3195';
    const REPO   = 'Official_Jersey';
    const BRANCH = 'Start-branch'; // если поменяешь ветку — исправь тут

    const API = `https://api.github.com/repos/${USER}/${REPO}/contents/`;

    const grid  = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const input = document.getElementById('q');

    let items = [];

    init();

    function init(){
      fetch(API)
        .then(r => r.json())
        .then(files => {
          items = (files || [])
            .filter(f => f.type === 'file' && /\.png$/i.test(f.name))
            .sort((a,b) => a.name.localeCompare(b.name,'en',{sensitivity:'base'}))
            .map(f => {
              const display = f.name
                .replace(/-small\.png$/i,'')
                .replace(/\.png$/i,'');
              const encoded = encodeURIComponent(f.name);
              const cdn = `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@${BRANCH}/${encoded}`;
              const raw = `https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/${encoded}`;
              return { name:f.name, display, cdn, raw };
            });

          render(items);
        })
        .catch(err => {
          grid.innerHTML = `<div class="empty">Ошибка загрузки списка файлов: ${err?.message || err}</div>`;
        });

      input.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        if(!q){ render(items); return; }
        const f = items.filter(x => x.display.toLowerCase().includes(q));
        render(f);
      });
    }

    function render(arr){
      if(!arr.length){
        grid.innerHTML = '';
        empty.hidden = false;
        return;
      }
      empty.hidden = true;

      grid.innerHTML = arr.map(it => `
        <article class="card">
          <a class="thumb" href="${it.cdn}" target="_blank" rel="noopener">
            <img src="${it.cdn}" alt="${escapeHtml(it.display)}" loading="lazy" />
          </a>
          <div class="meta">
            <div class="title">${escapeHtml(it.display)}</div>
            <div class="actions">
              <button class="btn" data-copy="${it.cdn}">Copy URL (CDN)</button>
              <button class="btn secondary" data-copy="${it.raw}">Copy URL (raw)</button>
              <a class="btn" href="${it.cdn}" target="_blank" rel="noopener">Open</a>
            </div>
          </div>
        </article>
      `).join('');

      // навешиваем копирование
      grid.querySelectorAll('button[data-copy]').forEach(btn => {
        btn.addEventListener('click', async () => {
          try{
            await navigator.clipboard.writeText(btn.dataset.copy);
            const old = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = old, 900);
          }catch(e){
            alert('Не удалось скопировать ссылку: ' + (e?.message || e));
          }
        });
      });
    }

    function escapeHtml(s){
      return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
  </script>
</body>
</html>
